# Secretia — capa pública de branding sobre Open WebUI.
# Proxy a open-webui + inyección del CSS de marca + servir assets estáticos.

# Mapa para el header Connection de websockets (chat en tiempo real).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Subir un poco el límite por si se suben imágenes/archivos al chat.
    client_max_body_size 100m;

    # ── Assets estáticos de Secretia (CSS, logo, fuente) ──────────────────
    location /secretia/ {
        alias /usr/share/nginx/secretia/;
        access_log off;
        expires 7d;
    }

    # ── Todo lo demás: proxy a Open WebUI ─────────────────────────────────
    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # sub_filter NO funciona sobre respuestas comprimidas:
        # pedimos el HTML sin gzip al upstream.
        proxy_set_header Accept-Encoding "";

        # Inyecta el CSS de Secretia justo antes de cerrar el <head>.
        # (best-effort: si Open WebUI cambia su HTML, revisar este filtro.)
        sub_filter '</head>' '<link rel="stylesheet" href="/secretia/secretia.css"></head>';
        sub_filter_once  on;
        sub_filter_types text/html;
    }
}
