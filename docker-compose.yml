# Secretia — IA de la familia Escriba
# Distribución lista para "cocinar": Ollama (motor de modelos) + Open WebUI (front)
# + una capa nginx que aplica el branding Escriba e inyecta el CSS de acento.
#
# IMPORTANTE: Secretia es un FORK/DISTRIBUCIÓN de Open WebUI (https://openwebui.com)
# con branding Escriba. No reescribimos su UI; la envolvemos. Ver README → "Atribución".
#
# Deploy: EasyPanel → tipo "Compose", apuntando a este repo.
#   - Servicio público: SOLO `web` (puerto 8080). Mapeá tu dominio a ese puerto.
#   - `ollama` y `open-webui` quedan internos (sin puertos publicados).
#   - Copiá `.env.example` a `.env` y completá los valores antes de levantar.

name: secretia

services:
  # ── Motor de modelos (interno) ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Sin `ports`: solo accesible dentro de la red del proyecto.
    # Necesita salida a internet para `ollama pull <modelo>` (ver README).
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Front Open WebUI (interno; lo expone `web`) ──────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=${WEBUI_NAME:-Secretia}
      - WEBUI_URL=${WEBUI_URL}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Alta local desactivada: el alta entra por Lockatus (OIDC).
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      # ── Federación con Lockatus (OIDC) ──
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-true}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-Lockatus}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI:-}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid email profile}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      - OAUTH_CODE_CHALLENGE_METHOD=${OAUTH_CODE_CHALLENGE_METHOD:-S256}   # Lockatus EXIGE PKCE
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-true}                       # false = solo botón Lockatus
    volumes:
      - open-webui:/app/backend/data

  # ── Página de Modelos (interno; lo expone `web` en /modelos) ─────────────
  # Catálogo + descargador de modelos de Ollama, UI Escriba, roles dios/humano,
  # federable con Lockatus. Solo el rol dios descarga/borra.
  models:
    build: ./models
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODELS_SESSION_SECRET=${MODELS_SESSION_SECRET}
      - DIOS_PASSWORD=${DIOS_PASSWORD:-}
      - HUMANO_PASSWORD=${HUMANO_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Federación opcional con Lockatus (si está, oculta el login local)
      - LOCKATUS_ISSUER=${MODELS_LOCKATUS_ISSUER:-}
      - LOCKATUS_CLIENT_ID=${MODELS_LOCKATUS_CLIENT_ID:-secretia-modelos}
      - MODELS_PUBLIC_URL=${MODELS_PUBLIC_URL:-}
      - MODELS_ALLOW_LOCAL_LOGIN=${MODELS_ALLOW_LOCAL_LOGIN:-false}

  # ── Capa pública: nginx con branding Escriba ─────────────────────────────
  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - open-webui
      - models
    ports:
      - "8080:8080"           # ← mapeá tu dominio público a este puerto
    environment:
      - OPEN_WEBUI_UPSTREAM=open-webui:8080
      - MODELS_UPSTREAM=models:8090
      - NGINX_ENVSUBST_FILTER=(OPEN_WEBUI_UPSTREAM|MODELS_UPSTREAM)
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./web:/usr/share/nginx/secretia:ro

volumes:
  ollama:
  open-webui:
